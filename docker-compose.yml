services:
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PROJECT_DIR: /opt/project
      MLFLOW_TRACKING_URI: http://mlflow:5000
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./airflow:/opt/airflow/dags
      - .:/opt/project
      - airflow_data:/opt/airflow
    ports:
      - "8081:8080"
    shm_size: "2gb"
    depends_on:
      - mlflow
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      bash -c
      "airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true;
      airflow webserver --port 8080 &
      exec airflow scheduler"

  mlflow:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /opt/project
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,localhost:5001,127.0.0.1,127.0.0.1:5000,127.0.0.1:5001"
      --serve-artifacts
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/artifacts

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /opt/project
    volumes:
      - .:/opt/project
    ports:
      - "8001:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  streamlit:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /opt/project
    volumes:
      - .:/opt/project
    ports:
      - "8502:8501"
    depends_on:
      - api
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  airflow_data:
